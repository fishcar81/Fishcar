<header class="head"><div><p class="eyebrow">CHAPTER 17 · PLAYABLE EDITION</p><h1>黄金替罪芙 <small>第 17 关《双重证词》</small></h1><p class="sub">本关将<strong>两只延迟不同的替罪芙</strong>纳入同一个终局：黄金箱、铁箱、双传送、双钥匙和四块压板必须同时成立。胜利条件只有一条：<b>收齐钥匙、压住所有压板，并让芙抵达 Exit。</b></p></div><div class="badge" id="badge"></div></header>

<script>
(()=>{'use strict';
const MAP=["#####################","#.......b...C..B..###","#.###############.###","#.##############E.###","#..a.q###############","#####################","############Q.....###","#################.###","#################.###","#################.###","##############t.I.S##","#####################","#####################","#######.....T########","#######.#############","#######.#############","#P..G...A############","#####################","#####################"];
const W=21,H=19,DELAYS=[5,8];
const DIR={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,-1],s:[0,1],a:[-1,0],d:[1,0],W:[0,-1],S:[0,1],A:[-1,0],D:[1,0]};
const SYM={'0,-1':'↑','0,1':'↓','-1,0':'←','1,0':'→'};
const MOVE={U:'ArrowUp',D:'ArrowDown',L:'ArrowLeft',R:'ArrowRight'};
const SOL=[...'RRRRRRUUURRRRRRRRUUUULLLLLLLLLUUURRRRRRRRRRRRRRRRDDL'].map(v=>MOVE[v]);
const VIEW_W=1420,VIEW_H=835,DPR=Math.min(window.devicePixelRatio||1,2);const cv=document.querySelector('#game'),x=cv.getContext('2d'),badge=document.querySelector('#badge');cv.width=VIEW_W*DPR;cv.height=VIEW_H*DPR;cv.style.width=VIEW_W+'px';cv.style.height=VIEW_H+'px';x.setTransform(DPR,0,0,DPR,0,0);
const fu=new Image(),echoFu=new Image();fu.src='../assets/characters/fu.png';echoFu.src='../assets/characters/echo-fu.png';
const P=(x,y)=>({x,y}),cp=p=>p?P(p.x,p.y):null,eq=(a,b)=>!!a&&!!b&&a.x===b.x&&a.y===b.y,inMap=p=>p.x>=0&&p.y>=0&&p.x<W&&p.y<H,raw=p=>inMap(p)?MAP[p.y][p.x]:'#';
let start,startGold,startIron,T,t,Q,q,A,B,C,S,keyA,keyB,exit;
MAP.forEach((r,y)=>[...r].forEach((c,x)=>{let p=P(x,y);if(c==='P')start=p;if(c==='G')startGold=p;if(c==='I')startIron=p;if(c==='T')T=p;if(c==='t')t=p;if(c==='Q')Q=p;if(c==='q')q=p;if(c==='A')A=p;if(c==='B')B=p;if(c==='C')C=p;if(c==='S')S=p;if(c==='a')keyA=p;if(c==='b')keyB=p;if(c==='E')exit=p;}));
function fresh(){return {p:cp(start),boxes:[{id:'gold',p:cp(startGold)},{id:'iron',p:cp(startIron)}],echos:[null,null],moves:[],keys:{a:false,b:false},step:0,status:'play',last:'准备：替罪芙是投影：不推动箱子、可穿过箱子；撞墙或传送出口被占用时会原地停留。Ⅰ在第 5 步后出现，Ⅱ在第 8 步后出现。',history:[]}}
let s=fresh(),timer=null;
const boxAt=(p,st=s)=>st.boxes.findIndex(b=>eq(b.p,p));
const alpha=(st=s)=>st.boxes.some(b=>b.id==='gold'&&eq(b.p,A));
const gamma=(st=s)=>st.boxes.some(b=>b.id==='iron'&&eq(b.p,S));
const beta=(st=s)=>eq(st.echos[0],B);
const delta=(st=s)=>eq(st.echos[1],C);
const allPlates=(st=s)=>alpha(st)&&gamma(st)&&beta(st)&&delta(st);
const allKeys=(st=s)=>st.keys.a&&st.keys.b;
function blocked(p){return raw(p)==='#'}function portalExit(p){let c=raw(p);if(c==='T')return cp(t);if(c==='t')return cp(T);if(c==='Q')return cp(q);if(c==='q')return cp(Q);return null}function land(p){return portalExit(p)||p}function occupied(p,actor,ignoreBox=-1,ignoreEcho=-1){if(s.boxes.some((b,i)=>i!==ignoreBox&&eq(b.p,p)))return true;if(actor!=='player'&&eq(s.p,p))return true;if(s.echos.some((e,i)=>i!==ignoreEcho&&eq(e,p)))return true;return false}function snapshot(){return {p:cp(s.p),boxes:s.boxes.map(b=>({id:b.id,p:cp(b.p)})),echos:s.echos.map(cp),moves:[...s.moves],keys:{...s.keys},step:s.step,status:s.status,last:s.last}}
function restore(o){s={...o,history:s.history.slice(0,-1)}}
function stop(){if(timer){clearInterval(timer);timer=null;document.querySelector('#auto').textContent='自动演示'}}
function fail(msg){s.status='fail';s.last=`<span class="warn">失败：</span>${msg}`;stop();draw()}
function attempt(origin,d,actor,otherEchos=[],echoIndex=-1){let [dx,dy]=d,target=P(origin.x+dx,origin.y+dy),bi=boxAt(target),push=actor==='player'&&bi>=0;if(blocked(target)&&!push)return {ok:false,why:'前方不可通行'};let end=push?target:land(target);if(!push&&portalExit(target)&&occupied(end,actor,-1,echoIndex))return {ok:false,why:'传送出口被占用'};if(blocked(end)&&!push)return {ok:false,why:'传送落点不可用'};if(actor==='player'&&otherEchos.some(e=>eq(end,e)))return {ok:false,hit:true,why:'芙走进了替罪芙所在格'};if(actor==='echo'&&eq(end,s.p))return {ok:false,hit:true,why:'替罪芙碰到了芙'};if(push){let pushed=P(target.x+dx,target.y+dy);if(blocked(pushed)||boxAt(pushed)>=0||otherEchos.some(e=>eq(pushed,e)))return {ok:false,why:'箱子无法向该方向推动'};let be=land(pushed);if(portalExit(pushed)&&occupied(be,'box',bi,-1))return {ok:false,why:'传送出口被占用'};if(blocked(be)||boxAt(be)>=0||otherEchos.some(e=>eq(be,e))||eq(be,s.p))return {ok:false,why:'箱子传送落点被占用'};s.boxes[bi].p=be;return {ok:true,end,push:s.boxes[bi].id,warp:!eq(pushed,be)}}return {ok:true,end,warp:!eq(target,end)}}function move(name,silent=false){if(s.status!=='play'||!DIR[name])return false;let d=DIR[name],oldP=cp(s.p),before=snapshot(),r=attempt(s.p,d,'player',s.echos);
 if(!r.ok){if(r.hit)fail(r.why);else{s.last=`<b>第 ${s.step} 步未计入：</b>${r.why}`;draw()}return false}
 s.history.push(before);s.p=r.end;s.step++;s.moves.push(name);
 let sym=SYM[`${d[0]},${d[1]}`],notes=[`芙 ${sym} → (${s.p.x},${s.p.y})`];
 if(r.push)notes.push(r.warp?'箱子经传送门传送':`${r.push==='gold'?'黄金箱':'铁箱'}被推动`);
 if(r.warp&&!r.push)notes.push('经传送门传送');
 if(!s.keys.a&&eq(s.p,keyA)){s.keys.a=true;notes.push('<span class="keyword">取得 α 钥匙</span>')}
 if(!s.keys.b&&eq(s.p,keyB)){s.keys.b=true;notes.push('<span class="keyword">取得 β 钥匙</span>')}
 for(let i=0;i<DELAYS.length;i++){let delay=DELAYS[i];if(s.step===delay){s.echos[i]=cp(start);notes.push(`<span class="violet">第 ${delay} 步结束：替罪芙${i+1===1?'Ⅰ':'Ⅱ'}出现</span>`)}else if(s.step>delay){let follow=s.moves[s.step-delay-1],er=attempt(s.echos[i],DIR[follow],'echo',[],i);if(!er.ok){if(er.hit){fail(`替罪芙${i+1===1?'Ⅰ':'Ⅱ'}碰到了芙`);return false}notes.push(`<span class="violet">替罪芙${i+1===1?'Ⅰ':'Ⅱ'}受阻，原地停留</span>`)}else{s.echos[i]=er.end;notes.push(`<span class="violet">替罪芙${i+1===1?'Ⅰ':'Ⅱ'}复现第 ${s.step-delay} 步 ${SYM[`${DIR[follow][0]},${DIR[follow][1]}`]}</span>`)}if(eq(s.p,s.echos[i])){fail(`替罪芙${i+1===1?'Ⅰ':'Ⅱ'}碰到了芙`);return false}}
 }
 if(eq(oldP,s.p)&&false){} // keeps old player state explicit for collision auditing
 if(eq(s.p,exit)){if(allKeys()&&allPlates()){s.status='win';if(!silent)notifyComplete();notes.push('<span class="keyword">所有条件已满足，抵达 Exit，通关。</span>');stop()}else notes.push('<span class="warn">已抵达 Exit，但钥匙或压板尚未全部满足。</span>')}
 s.last=notes.join('　·　');if(!silent)draw();return true
}
function notifyComplete(){if(window.parent!==window)window.parent.postMessage({type:'golden-scapegoat-complete',level:17},window.location.origin)}function reset(){stop();s=fresh();showHintBar(null);draw()}
function undo(){showHintBar(null);if(!s.history.length||s.status==='win')return;stop();let o=s.history.pop();s={...o,history:s.history};draw()}
function showHintBar(html){let bar=document.querySelector('#hintBar'),text=document.querySelector('#hintText');if(bar)bar.hidden=!html;if(text)text.innerHTML=html}function hint(){if(s.status!=='play')return;let moveName=SOL[s.step];if(!moveName){s.last='<span class="keyword">标准答案已到最后一步。</span>';showHintBar(s.last);draw();return}let d=DIR[moveName],symbol=SYM[`${d[0]},${d[1]}`];s.last=`<span class="keyword">标准答案下一步：${symbol}</span>　按方向键执行；提示不会替你移动。`;showHintBar(s.last);draw()}function next(){stop();if(s.status!=='play')return;let n=SOL[s.step];if(!n){s.last='提示：自动解法已执行完毕。';draw();return}move(n)}
function auto(){if(timer){stop();return}if(s.status!=='play')reset();document.querySelector('#auto').textContent='停止演示';timer=setInterval(()=>{if(!move(SOL[s.step]))stop();if(s.status!=='play'||s.step>=SOL.length)stop()},285)}
const Z=28,OX=570,OY=105;
function rr(X,Y,w,h,r){x.beginPath();x.roundRect(X,Y,w,h,r)}
function tile(px,py,c){let floor=['.','P','G','I','T','t','Q','q','A','B','C','S','a','b','E'].includes(c);if(c==='#'){x.fillStyle='#16233c';x.fillRect(px,py,Z,Z);x.strokeStyle='#5f789e';x.lineWidth=1;x.strokeRect(px+.5,py+.5,Z-1,Z-1);x.strokeStyle='#344a70';x.beginPath();x.moveTo(px,py+Z*.48);x.lineTo(px+Z,py+Z*.48);x.moveTo(px+Z*.5,py);x.lineTo(px+Z*.5,py+Z*.48);x.stroke();return}x.fillStyle=floor?'#0a1429':'#070b15';x.fillRect(px,py,Z,Z);x.strokeStyle='#1d3456';x.lineWidth=1;x.strokeRect(px+.5,py+.5,Z-1,Z-1);
 let cx=px+Z/2,cy=py+Z/2;
 if(c==='T'||c==='t'){x.fillStyle='#cc7ff3';x.beginPath();x.arc(cx,cy,9,0,Math.PI*2);x.fill();x.strokeStyle='#f0c7ff';x.lineWidth=2;x.stroke();x.fillStyle='#fff';x.font='900 12px Microsoft YaHei';x.fillText(c==='T'?'T':'t',cx-4,cy+4)}
 if(c==='q'||c==='Q'){x.fillStyle='#20577f';x.fillRect(px+3,py+3,Z-6,Z-6);x.strokeStyle='#74e5ff';x.lineWidth=2;x.strokeRect(px+5,py+5,Z-10,Z-10);x.fillStyle='#b8f4ff';x.font='900 13px Microsoft YaHei';x.fillText(c,cx-4,cy+5)}
 if(['A','S','B','C'].includes(c)){let active=c==='A'?alpha():c==='S'?gamma():c==='B'?beta():delta();x.fillStyle=active?'#5a4a19':'#2b2438';rr(px+4,py+17,Z-8,7,3);x.fill();x.strokeStyle=active?'#ffe06c':c==='A'||c==='S'?'#cfa446':'#cda5ff';x.lineWidth=2;x.stroke();x.fillStyle=active?'#fff2aa':'#d9cbef';x.font='900 11px Microsoft YaHei';x.fillText(c==='A'?'α':c==='S'?'γ':c==='B'?'β':'δ',cx-4,py+14)}
 if(c==='a'||c==='b'){let got=c==='a'?s.keys.a:s.keys.b;x.save();x.translate(cx,cy);x.fillStyle=got?'#47536c':'#ffd765';x.beginPath();x.arc(-5,-3,5,0,Math.PI*2);x.fill();x.fillRect(-1,-5,12,4);x.fillRect(6,-1,3,6);x.fillRect(10,-1,3,4);x.restore();x.fillStyle=got?'#8995ae':'#fff0a8';x.font='900 10px Microsoft YaHei';x.fillText(c==='a'?'α':'β',px+16,py+25)}
 if(c==='E'){x.fillStyle='#1d7e67';rr(px+4,py+4,Z-8,Z-8,5);x.fill();x.strokeStyle='#9dffcf';x.lineWidth=2;x.stroke();x.fillStyle='#dffff1';x.font='900 10px Microsoft YaHei';x.fillText('EXIT',px+2,py+17)}
}
function crate(b){let px=OX+b.p.x*Z,py=OY+b.p.y*Z,isGold=b.id==='gold';x.fillStyle=isGold?'#ad741f':'#64758c';rr(px+4,py+4,Z-8,Z-8,4);x.fill();x.strokeStyle=isGold?'#ffe39a':'#c6d8ef';x.lineWidth=2;x.stroke();x.strokeStyle=isGold?'#7a4c12':'#35465b';x.lineWidth=1;x.beginPath();x.moveTo(px+5,py+5);x.lineTo(px+Z-5,py+Z-5);x.moveTo(px+Z-5,py+5);x.lineTo(px+5,py+Z-5);x.stroke();x.fillStyle='#fff4c4';x.font='900 10px Microsoft YaHei';x.fillText(isGold?'金':'铁',px+9,py+18)}
function entity(p,type,img,label){if(!p)return;let px=OX+p.x*Z,py=OY+p.y*Z;x.save();x.beginPath();rr(px+3,py+3,Z-6,Z-6,7);x.clip();if(img.complete&&img.naturalWidth){let scale=Math.min((Z-6)/img.naturalWidth,(Z-6)/img.naturalHeight),w=img.naturalWidth*scale,h=img.naturalHeight*scale;x.drawImage(img,px+(Z-w)/2,py+(Z-h)/2,w,h)}else{x.fillStyle=type==='player'?'#ffd66f':type==='echo1'?'#cda5ff':'#8ccfff';x.fillRect(px+4,py+4,Z-8,Z-8)}x.restore();x.strokeStyle=type==='player'?'#ffeaa6':type==='echo1'?'#e2c8ff':'#9be6ff';x.lineWidth=2;rr(px+3,py+3,Z-6,Z-6,7);x.stroke();x.fillStyle='#fff';x.font='900 9px Microsoft YaHei';x.fillText(label,px+9,py+25)}

function updateWinModal(){let won=s.status==='win',modal=document.querySelector('#winModal');modal.hidden=!won;if(won){document.querySelector('#winSteps').textContent=`本关共使用 ${s.step} 步`;document.querySelector('#winNext').textContent='返回关卡选择'}}function goNext(){if(s.status!=='win')return;if(window.parent!==window){window.parent.postMessage({type:'golden-scapegoat-open-next',level:17},window.location.origin);return}location.href='../index.html'}function draw(){x.clearRect(0,0,VIEW_W,VIEW_H);let bg=x.createLinearGradient(0,0,VIEW_W,VIEW_H);bg.addColorStop(0,'#17315d');bg.addColorStop(1,'#060913');x.fillStyle=bg;x.fillRect(0,0,VIEW_W,VIEW_H);x.fillStyle='#f0f5ff';x.font='900 23px Microsoft YaHei';x.fillText('第 17 关 · 双重证词',OX,38);x.fillStyle='#a9bde1';x.font='500 13px Microsoft YaHei';x.fillText('传送门对芙、替罪芙与箱子通用；投影受阻会停留，碰到芙才失败。',OX,61);MAP.forEach((r,y)=>[...r].forEach((c,gx)=>tile(OX+gx*Z,OY+y*Z,c)));s.boxes.forEach(crate);entity(s.echos[1],'echo2',echoFu,'Ⅱ');entity(s.echos[0],'echo1',echoFu,'Ⅰ');entity(s.p,'player',fu,'芙');let sx=28;panel(sx,100,510,270,'实时验证');let f1=s.step<5?'Ⅰ待命 · 第 5 步出现':`Ⅰ复现第 ${Math.max(0,s.step-5)} 步`;let f2=s.step<8?'Ⅱ待命 · 第 8 步出现':`Ⅱ复现第 ${Math.max(0,s.step-8)} 步`;stat(sx+18,149,'替罪芙',`${f1}　${f2}`,(s.echos[0]||s.echos[1])?'#dec6ff':'#ffd971',474);stat(sx+18,220,'钥匙',`α ${s.keys.a?'✓':'✕'}　β ${s.keys.b?'✓':'✕'}`,allKeys()?'#7cf5bb':'#ffca8c',474);stat(sx+18,291,'压板',`α ${alpha()?'✓':'✕'}　β ${beta()?'✓':'✕'}　γ ${gamma()?'✓':'✕'}　δ ${delta()?'✓':'✕'}`,allPlates()?'#7cf5bb':'#ffca8c',474);goalPanel(sx,394,510);let status=s.status==='win'?'已验证通关':s.status==='fail'?'失败':'进行中';badge.innerHTML=`<strong>第 ${s.step} 步 · ${status}</strong>`;updateWinModal()}function verify(){let errors=[];if(!MAP.every(r=>r.length===W))errors.push('地图宽度不一致');for(let c of ['P','G','I','T','t','Q','q','A','B','C','S','a','b','E'])if(MAP.join('').split(c).length-1!==1)errors.push(c+' 数量异常');let hold=s;s=fresh();for(let m of SOL){if(!move(m,true)){errors.push(`自动解法在第 ${s.step+1} 步失效`);break}}if(s.status!=='win')errors.push('Exit 无法完成钥匙与四压板验证');if(!(s.keys.a&&s.keys.b&&alpha()&&gamma()&&beta()&&delta()))errors.push('终局要素未全部实际使用');s=hold;if(errors.length)throw new Error(errors.join('；'));console.info('第17关校验通过：双替罪芙（5/8步）、四压板、双箱、双传送、双钥匙；共 '+SOL.length+' 步。')}
