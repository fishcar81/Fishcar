<section class="goal"><h2>本关说明</h2><p>替罪芙在芙走满 6 步后开始复现移动。收集 α / β 两把钥匙，用箱子或替罪芙压住全部压板，再抵达 Exit。</p></section></main><script src="solver-bridge.js"></script><script>

const P=(x,y)=>({x,y}),cp=p=>p?P(p.x,p.y):null,eq=(a,b)=>!!a&&!!b&&a.x===b.x&&a.y===b.y,inMap=p=>p.x>=0&&p.y>=0&&p.x<W&&p.y<H,raw=p=>inMap(p)?MAP[p.y][p.x]:'#';let start,T,t,Q,q,A,B,S,keyA,keyB,exit;MAP.forEach((r,y)=>[...r].forEach((c,x)=>{let p=P(x,y);if(c==='P')start=p;if(c==='T')T=p;if(c==='t')t=p;if(c==='Q')Q=p;if(c==='q')q=p;if(c==='A')A=p;if(c==='B')B=p;if(c==='S')S=p;if(c==='a')keyA=p;if(c==='b')keyB=p;if(c==='E')exit=p;}));

fillRect(px+Z-14,py+9,5,5)}function entity(p,type,img,label){if(!p)return;const px=OX+p.x*Z,py=OY+p.y*Z;x.save();rr(px+3,py+3,Z-6,Z-6,7);x.clip();if(img.complete&&img.naturalWidth){const scale=Math.min((Z-6)/img.naturalWidth,(Z-6)/img.naturalHeight),w=img.naturalWidth*scale,h=img.naturalHeight*scale;x.drawImage(img,px+(Z-w)/2,py+(Z-h)/2,w,h)}else{x.fillStyle=type==='player'?'#ffd66f':'#c79cff';x.fillRect(px+4,py+4,Z-8,Z-8)}x.restore();x.strokeStyle=type==='player'?'#ffeaa6':'#e2c8ff';x.lineWidth=2;rr(px+3,py+3,Z-6,Z-6,7);x.stroke();x.fillStyle='#fff';x.font='900 9px Microsoft YaHei';x.fillText(label||(type==='player'?'芙':'替罪芙'),px+9,py+25)}function panel(X,Y,w,h,title){x.fillStyle='#0b1730';rr(X,Y,w,h,13);x.fill();x.strokeStyle='#496493';x.lineWidth=1.4;x.stroke();x.fillStyle='#ffd971';x.font='900 17px Microsoft YaHei';x.fillText(title,X+17,Y+30)}function goalPanel(X,Y,w){panel(X,Y,w,127,'通关目标');x.fillStyle='#d4e0f5';x.font='700 15px Microsoft YaHei';x.fillText('收集全部钥匙',X+18,Y+57);x.fillText('压住所有压板',X+18,Y+82);x.fillStyle='#a9ffd5';x.font='900 15px Microsoft YaHei';x.fillText('抵达 Exit',X+18,Y+107)}function stat(X,Y,title,val,col,w=230){x.fillStyle='#081328';rr(X,Y,w,57,9);x.fill();x.strokeStyle='#2d4773';x.stroke();x.fillStyle='#9bb0d5';x.font='700 12px Microsoft YaHei';x.fillText(title,X+12,Y+20);x.fillStyle=col;x.font='900 15px Microsoft YaHei';x.fillText(val,X+12,Y+43)}function updateWinModal(){let won=s.status==='win',modal=document.querySelector('#winModal');modal.hidden=!won;if(won){document.querySelector('#winSteps').textContent=`本关共使用 ${s.step} 步`;document.querySelector('#winNext').textContent='下一关 / Enter'}}function goNext(){if(s.status!=='win')return;if(window.parent!==window){window.parent.postMessage({type:'golden-scapegoat-open-next',level:11},MESSAGE_ORIGIN);return}location.href='level-12.html'}function draw(){x.clearRect(0,0,VIEW_W,VIEW_H);let bg=x.createLinearGradient(0,0,VIEW_W,VIEW_H);bg.addColorStop(0,'#17315d');bg.addColorStop(1,'#060913');x.fillStyle=bg;x.fillRect(0,0,VIEW_W,VIEW_H);x.fillStyle='#f0f5ff';x.font='900 23px Microsoft YaHei';x.fillText('第 11 关 · 延迟六步的证词',OX,38);x.fillStyle='#a9bde1';x.font='500 13px Microsoft YaHei';x.fillText('所有传送门对人物、替罪芙与箱子通用；出口被占用时不能传送。',OX,61);MAP.forEach((r,y)=>[...r].forEach((c,gx)=>tile(OX+gx*Z,OY+y*Z,c)));s.boxes.forEach(crate);entity(s.echo,'echo',echoFu);entity(s.p,'player',fu);let sx=28,pw=617,inner=pw-28;panel(sx,100,pw,290,'实时验证');let follow=s.step<DELAY?`待命 · 第 ${DELAY} 步出现`:s.echo?`跟随中 · 复现第 ${s.step-DELAY} 步`:'出现中';stat(sx+14,142,'替罪芙',follow,s.echo?'#dec6ff':'#ffd971',inner);stat(sx+14,205,'钥匙',`α ${s.keys.a?'✓':'✕'}　β ${s.keys.b?'✓':'✕'}`,allKeys()?'#7cf5bb':'#ffca8c',inner);stat(sx+14,268,'压板',`α ${alpha()?'✓':'✕'}　β ${beta()?'✓':'✕'}　γ ${gamma()?'✓':'✕'}`,allPlates()?'#7cf5bb':'#ffca8c',inner);panel(sx,405,pw,165,'通关目标');x.fillStyle='#d4e0f5';x.font='700 14px Microsoft YaHei';x.fillText('收集全部钥匙',sx+14,460);x.fillText('压住所有压板',sx+14,490);x.fillStyle='#a9ffd5';x.font='900 14px Microsoft YaHei';x.fillText('抵达 Exit',sx+14,520);let status=s.status==='win'?'已验证通关':s.status==='fail'?'失败':'进行中';badge.innerHTML=`<strong>第 ${s.step} 步 · ${status}</strong>`;updateWinModal()}function verify(){let e=[];if(!MAP.every(r=>r.length===W))e.push('地图宽度不一致');for(let c of ['P','T','t','Q','q','A','B','S','a','b','E'])if(MAP.join('').split(c).length-1!==1)e.push(c+' 数量异常');let hold=s;s=fresh();for(let m of SOL)if(!move(m,true)){e.push(`解法在第 ${s.step+1} 步失效`);break}if(s.status!=='win')e.push('Exit 无法完成钥匙与压板验证');s=hold;if(e.length)throw new Error(e.join('；'));console.info('V6 校验通过：无锁门机制、双钥匙、三压板、六步延迟回声；共 '+SOL.length+' 步。')}
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.repeat&&s.status==='win'&&!document.activeElement?.matches('input,textarea,select,video')){e.preventDefault();goNext();return}if(DIR[e.key]){e.preventDefault();stop();move(e.key)}if(e.key==='r'||e.key==='R')reset();if(e.key==='z'||e.key==='Z')undo();if(e.key==='h'||e.key==='H')hint()});document.querySelector('#undo').onclick=undo;document.querySelector('#hint').onclick=hint;document.querySelector('#reset').onclick=reset;document.querySelector('#winRestart').onclick=reset;document.querySelector('#winNext').onclick=goNext;let stepButton=document.querySelector('#step'),autoButton=document.querySelector('#auto');if(stepButton)stepButton.onclick=next;if(autoButton)autoButton.onclick=auto;fu.onload=draw;echoFu.onload=draw;verify();draw();})();
