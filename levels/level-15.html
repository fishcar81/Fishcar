const MOVE={U:'ArrowUp',D:'ArrowDown',L:'ArrowLeft',R:'ArrowRight'},SOL=[...'RDDLD',...'RRR',...'DD',...'RRRR',...'DDDDD',...Array(13).fill('L'),...'UU',...'RRRR',...'DRRRRR',...'DRRRRUUULLLDD',...'RRRUULLLLL',...'RRDDRDD',...'DRRRUR'].map(c=>MOVE[c]);
const VIEW_W=1340,VIEW_H=790,DPR=Math.min(window.devicePixelRatio||1,2);const cv=document.querySelector('#game'),x=cv.getContext('2d'),badge=document.querySelector('#badge');cv.width=VIEW_W*DPR;cv.height=VIEW_H*DPR;cv.style.width=VIEW_W+'px';cv.style.height=VIEW_H+'px';x.setTransform(DPR,0,0,DPR,0,0);const fu=new Image(),echoFu=new Image();fu.src='../assets/characters/fu.png';echoFu.src='../assets/characters/echo-fu.png';
const P=(x,y)=>({x,y}),cp=p=>p?P(p.x,p.y):null,eq=(a,b)=>!!a&&!!b&&a.x===b.x&&a.y===b.y,inMap=p=>p.x>=0&&p.y>=0&&p.x<W&&p.y<H,raw=p=>inMap(p)?MAP[p.y][p.x]:'#';let start,T,t,Q,q,A,B,S,keyA,keyB,exit;MAP.forEach((r,y)=>[...r].forEach((c,x)=>{let p=P(x,y);if(c==='P')start=p;if(c==='T')T=p;if(c==='t')t=p;if(c==='Q')Q=p;if(c==='q')q=p;if(c==='A')A=p;if(c==='B')B=p;if(c==='S')S=p;if(c==='a')keyA=p;if(c==='b')keyB=p;if(c==='E')exit=p;}));
function fresh(){return {p:cp(start),boxes:[{id:'gold',p:P(2,1)},{id:'iron',p:P(10,13)}],echo:null,moves:[],keys:{a:false,b:false},step:0,status:'play',last:'准备：所有传送门均可由芙、替罪芙和箱子使用。推箱进入传送门时，芙只停在箱子原格；第 6 步后替罪芙开始复现行动。',history:[]}}let s=fresh(),timer=null;
const boxAt=(p,st=s)=>st.boxes.findIndex(b=>eq(b.p,p));const alpha=(st=s)=>st.boxes.some(b=>b.id==='gold'&&eq(b.p,A)),beta=(st=s)=>eq(st.echo,B),gamma=(st=s)=>st.boxes.some(b=>b.id==='iron'&&eq(b.p,S)),allPlates=(st=s)=>alpha(st)&&beta(st)&&gamma(st),allKeys=(st=s)=>st.keys.a&&st.keys.b;
function blocked(p){return raw(p)==='#'}function portalExit(p){let c=raw(p);if(c==='T')return cp(t);if(c==='t')return cp(T);if(c==='Q')return cp(q);if(c==='q')return cp(Q);return null}function land(p){return portalExit(p)||p}function occupied(p,actor,ignoreBox=-1){if(s.boxes.some((b,i)=>i!==ignoreBox&&eq(b.p,p)))return true;if(actor!=='player'&&eq(s.p,p))return true;if(actor!=='echo'&&eq(s.echo,p))return true;return false}function snapshot(){return {p:cp(s.p),boxes:s.boxes.map(b=>({id:b.id,p:cp(b.p)})),echo:cp(s.echo),moves:[...s.moves],keys:{...s.keys},step:s.step,status:s.status,last:s.last}}

function attempt(origin,d,actor){let [dx,dy]=d,target=P(origin.x+dx,origin.y+dy),bi=boxAt(target),push=actor==='player'&&bi>=0;if(blocked(target)&&!push)return {ok:false,why:'前方不可通行'};let end=push?target:land(target);if(!push&&portalExit(target)&&occupied(end,actor))return {ok:false,why:'传送出口被占用'};if(blocked(end)&&!push)return {ok:false,why:'传送落点不可用'};if(actor==='player'&&eq(end,s.echo))return {ok:false,hit:true,why:'芙走进了替罪芙所在格'};if(actor==='echo'&&eq(end,s.p))return {ok:false,hit:true,why:'替罪芙撞到了芙'};if(push){let pushed=P(target.x+dx,target.y+dy);if(blocked(pushed)||boxAt(pushed)>=0||eq(pushed,s.echo))return {ok:false,why:'箱子无法向该方向推动'};let be=land(pushed);if(portalExit(pushed)&&occupied(be,'box',bi))return {ok:false,why:'传送出口被占用'};if(blocked(be)||boxAt(be)>=0||eq(be,s.echo)||eq(be,s.p))return {ok:false,why:'箱子传送落点被占用'};s.boxes[bi].p=be;return {ok:true,end,push:s.boxes[bi].id,warp:!eq(pushed,be)}}return {ok:true,end,warp:!eq(target,end)}}function move(name,silent=false){if(s.status!=='play'||!DIR[name])return false;let d=DIR[name],oldP=cp(s.p),oldE=cp(s.echo),before=snapshot(),r=attempt(s.p,d,'player');if(!r.ok){if(r.hit)fail(r.why);else{s.last=`<b>第 ${s.step} 步未计入：</b>${r.why}`;draw()}return false}s.history.push(before);s.p=r.end;s.step++;s.moves.push(name);let sym=SYM[`${d[0]},${d[1]}`],notes=[`芙 ${sym} → (${s.p.x},${s.p.y})`];if(r.push)notes.push(r.warp?'箱子经传送门传送':`${r.push==='gold'?'黄金箱':'铁箱'}被推动`);if(r.warp&&!r.push)notes.push('经传送门传送');if(!s.keys.a&&eq(s.p,keyA)){s.keys.a=true;notes.push('<span class="keyword">取得 α 钥匙</span>')}if(!s.keys.b&&eq(s.p,keyB)){s.keys.b=true;notes.push('<span class="keyword">取得 β 钥匙</span>')}

function notifyComplete(){if(window.parent!==window)window.parent.postMessage({type:'golden-scapegoat-complete',level:15},window.location.origin)}function reset(){stop();s=fresh();showHintBar(null);draw()}function undo(){showHintBar(null);stop();let old=s.history.pop();if(!old)return;let h=s.history;s={...old,p:cp(old.p),boxes:old.boxes.map(b=>({id:b.id,p:cp(b.p)})),echo:cp(old.echo),moves:[...old.moves],keys:{...old.keys},history:h};draw()}function showHintBar(html){let bar=document.querySelector('#hintBar'),text=document.querySelector('#hintText');if(bar)bar.hidden=!html;if(text)text.innerHTML=html}function hint(){if(s.status!=='play')return;let moveName=SOL[s.step];if(!moveName){s.last='<span class="keyword">标准答案已到最后一步。</span>';showHintBar(s.last);draw();return}let d=DIR[moveName],symbol=SYM[`${d[0]},${d[1]}`];s.last=`<span class="keyword">标准答案下一步：${symbol}</span>　按方向键执行；提示不会替你移动。`;showHintBar(s.last);draw()}function next(){stop();if(s.status==='play'&&SOL[s.step])move(SOL[s.step])}function auto(){if(timer)return stop();if(s.status!=='play')reset();document.querySelector('#auto').textContent='暂停演示';timer=setInterval(()=>{if(s.status!=='play'||s.step>=SOL.length){stop();return}move(SOL[s.step])},340)}
const Z=38,OX=530,OY=102;function rr(X,Y,w,h,r){x.beginPath();x.roundRect(X,Y,w,h,r)}function keyIcon(px,py,type,taken){let c=type==='a'?'#ffd766':'#79e9ff';x.globalAlpha=taken?.22:1;x.fillStyle=c;x.beginPath();x.arc(px+14,py+15,7,0,7);x.fill();x.fillRect(px+19,py+12,15,6);x.fillRect(px+27,py+16,5,6);x.fillRect(px+32,py+13,4,5);x.strokeStyle='#fff6bd';x.lineWidth=1;x.stroke();x.globalAlpha=1;x.fillStyle='#fff';x.font='900 9px Microsoft YaHei';x.fillText(type==='a'?'α':'β',px+10,py+18)}function tile(px,py,c){if(c==='#'){x.fillStyle='#141224';x.fillRect(px,py,Z,Z);x.fillStyle='#342e45';x.fillRect(px+2,py+2,Z-4,Z-4);x.strokeStyle='#978fab';x.strokeRect(px+2.5,py+2.5,Z-5,Z-5);x.fillStyle='rgba(255,255,255,.16)';x.fillRect(px+5,py+6,Z-10,2);return}x.fillStyle='#17365a';x.fillRect(px,py,Z,Z);x.fillStyle='#1d456f';x.fillRect(px+2,py+2,Z-4,Z-4);x.strokeStyle='rgba(167,213,255,.34)';x.strokeRect(px+.5,py+.5,Z-1,Z-1);if(c==='A'||c==='B'||c==='S'){let on=c==='A'?alpha():c==='B'?beta():gamma(),co=c==='A'?'#d99b2c':c==='B'?'#b181ff':'#eb8e6e';x.beginPath();x.arc(px+19,py+19,11,0,7);x.fillStyle=on?co:'#27274e';x.fill();x.strokeStyle=c==='A'?'#ffd46b':c==='B'?'#d4b2ff':'#ffb696';x.lineWidth=2;x.stroke();x.fillStyle='#fff';x.font='900 11px Microsoft YaHei';x.fillText(c==='A'?'α':c==='B'?'β':'γ',px+15,py+23)}if('TtQq'.includes(c)){let cc='Qq'.includes(c)?'#6de7ff':'#c79cff',g=x.createRadialGradient(px+19,py+19,1,px+19,py+19,18);g.addColorStop(0,'#fff');g.addColorStop(.2,cc);g.addColorStop(.62,'#25517c');g.addColorStop(1,'transparent');x.fillStyle=g;x.fillRect(px,py,Z,Z);x.fillStyle='#fff';x.font='900 11px Microsoft YaHei';x.fillText(c,px+15,py+23)}if(c==='a'||c==='b')keyIcon(px+2,py+2,c,c==='a'?s.keys.a:s.keys.b);if(c==='E'){x.fillStyle='#a9ffd5';x.font='900 9px Microsoft YaHei';x.fillText('EXIT',px+5,py+23)}}function crate(b){let px=OX+b.p.x*Z,py=OY+b.p.y*Z,co=b.id==='gold'?'#d88924':'#8294a9';x.fillStyle=co;rr(px+5,py+5,28,28,5);x.fill();x.strokeStyle='#fff0ae';x.lineWidth=1.4;x.strokeRect(px+8,py+8,22,22);x.beginPath();x.moveTo(px+8,py+8);x.lineTo(px+30,py+30);x.moveTo(px+30,py+8);x.lineTo(px+8,py+30);x.stroke()}function entity(p,type,img){if(!p)return;let px=OX+p.x*Z,py=OY+p.y*Z;x.save();rr(px+3,py+3,32,32,7);x.clip();if(img.complete&&img.naturalWidth){let r=Math.min(32/img.naturalWidth,32/img.naturalHeight),w=img.naturalWidth*r,h=img.naturalHeight*r;x.drawImage(img,px+19-w/2,py+19-h/2,w,h)}else{x.fillStyle=type==='echo'?'#c79cff':'#ffd66f';x.fillRect(px+4,py+4,30,30);x.fillStyle='#1c1832';x.font='900 15px Microsoft YaHei';x.fillText(type==='echo'?'替':'芙',px+11,py+24)}x.restore();x.strokeStyle=type==='echo'?'#d8c5ff':'#ffe198';x.lineWidth=2;rr(px+3,py+3,32,32,7);x.stroke()}function panel(X,Y,w,h,title){x.fillStyle='#0b1730';rr(X,Y,w,h,13);x.fill();x.strokeStyle='#496493';x.lineWidth=1.4;x.stroke();x.fillStyle='#ffd971';x.font='900 17px Microsoft YaHei';x.fillText(title,X+17,Y+30)}function goalPanel(X,Y,w){panel(X,Y,w,127,'通关目标');x.fillStyle='#d4e0f5';x.font='700 15px Microsoft YaHei';x.fillText('收集全部钥匙',X+18,Y+57);x.fillText('压住所有压板',X+18,Y+82);x.fillStyle='#a9ffd5';x.font='900 15px Microsoft YaHei';x.fillText('抵达 Exit',X+18,Y+107)}function stat(X,Y,title,val,col,w=230){x.fillStyle='#081328';rr(X,Y,w,57,9);x.fill();x.strokeStyle='#2d4773';x.stroke();x.fillStyle='#9bb0d5';x.font='700 12px Microsoft YaHei';x.fillText(title,X+12,Y+20);x.fillStyle=col;x.font='900 15px Microsoft YaHei';x.fillText(val,X+12,Y+43)}function updateWinModal(){let won=s.status==='win',modal=document.querySelector('#winModal');modal.hidden=!won;if(won){document.querySelector('#winSteps').textContent=`本关共使用 ${s.step} 步`;document.querySelector('#winNext').textContent='下一关'}}function goNext(){if(s.status!=='win')return;if(window.parent!==window){window.parent.postMessage({type:'golden-scapegoat-open-next',level:15},window.location.origin);return}location.href='level-16.html'}function draw(){x.clearRect(0,0,VIEW_W,VIEW_H);let bg=x.createLinearGradient(0,0,VIEW_W,VIEW_H);bg
