<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>黄金替罪芙 · 基础记录 01—05 / 试炼记录 15—17</title>
<style>
:root{--bg:#070a13;--panel:#0e1a31;--line:#405c88;--gold:#ffd66f;--text:#edf4ff;--muted:#aabbd8;--violet:#d7beff;--mint:#7cf5bb;--danger:#ffb09d}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -15%,#294a79 0,transparent 40%),var(--bg);font-family:"Microsoft YaHei",system-ui,sans-serif;color:var(--text)}.shell{width:min(1540px,96vw);margin:auto;padding:22px 0 32px}.top{display:flex;align-items:flex-end;justify-content:space-between;gap:22px;margin-bottom:14px}.eyebrow{margin:0 0 7px;color:var(--gold);font-weight:900;letter-spacing:.17em;font-size:12px}.top h1{font-size:clamp(28px,4vw,47px);margin:0;line-height:1.05}.top h1 small{font-size:.45em;color:#b9c9e5}.intro{margin:9px 0 0;max-width:790px;color:#c1cfe7;font-size:13px;line-height:1.65}.progress{min-width:265px;text-align:right;background:#0d1830;border:1px solid #786841;border-radius:12px;padding:11px 14px;color:#cbd8eb;font-size:13px;line-height:1.55}.progress b{color:#fff0bb;font-size:15px}.bar{height:7px;border-radius:10px;background:#1d2a43;overflow:hidden;margin-top:7px}.bar i{display:block;width:33.33%;height:100%;background:linear-gradient(90deg,#f4bf54,#fff0aa);transition:width .25s}.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-bottom:13px}.level{position:relative;min-height:151px;padding:16px;border:1px solid #344e77;border-radius:13px;background:linear-gradient(145deg,#142641,#0b1223);color:var(--text);text-align:left;cursor:pointer;transition:.18s transform,.18s border-color,.18s background}.level:hover:not(:disabled){transform:translateY(-2px);border-color:#8aa4d0;background:#172d4c}.level.active{border-color:var(--gold);background:linear-gradient(145deg,#453b21,#11182b);box-shadow:0 0 0 1px #ffe39b55}.level:disabled{cursor:not-allowed;opacity:.48}.num{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:50%;background:#263b5d;border:1px solid #6e88b5;color:#eaf3ff;font-weight:900}.level.active .num{background:#7a5720;border-color:#ffe196;color:#fff3c6}.level h2{margin:10px 0 7px;font-size:19px}.level p{margin:0;color:#b9c9e3;font-size:12px;line-height:1.6}.tag{position:absolute;right:14px;top:18px;color:#8ceac0;font-size:11px;font-weight:900}.locked{color:#d3dbe9}.frame{border:1px solid #6c6042;border-radius:18px;padding:8px;background:#0a0f1c;box-shadow:0 26px 76px #0009}.framebar{padding:8px 9px 11px;display:flex;justify-content:space-between;gap:15px;align-items:center;color:#b5c7e4;font-size:13px}.framebar strong{font-size:15px;color:#ffe184}.reset-progress{border:1px solid #4f6f9e;border-radius:7px;background:#152a4b;color:#eef5ff;padding:7px 10px;font-weight:800;font-size:12px;cursor:pointer}.reset-progress:hover{background:#294979}iframe{display:block;border:0;width:100%;height:1190px;background:#070b15;border-radius:10px}.rules{display:flex;justify-content:space-between;gap:18px;align-items:center;margin-top:13px;padding:13px 15px;border:1px solid #2c476f;border-radius:12px;background:#0b1427;color:#c4d3e9;font-size:13px;line-height:1.65}.rules p{margin:0}.rules b{color:#ffe08a}.rules .violet{color:var(--violet);font-weight:900}.toast{position:fixed;left:50%;top:22px;transform:translate(-50%,-14px);z-index:10;max-width:min(560px,92vw);padding:13px 17px;border:1px solid #a9f2ce;border-radius:12px;background:#113126;color:#e5fff1;box-shadow:0 14px 40px #0008;opacity:0;pointer-events:none;transition:.25s transform,.25s opacity;font-weight:800;text-align:center}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:800px){.shell{width:100%;padding:14px}.top{align-items:flex-start;flex-direction:column}.progress{text-align:left}.levels{grid-template-columns:1fr}.level{min-height:116px}iframe{height:1170px}.framebar,.rules{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<div class="toast" id="toast" role="status"></div>
<main class="shell">
<header class="top"><div><p class="eyebrow">GOLDEN SCAPEGOAT · PLAYABLE EDITION</p><h1>黄金替罪芙 <small>基础记录 01 — 05 / 试炼记录 15 — 17</small></h1><p class="intro">先完成五段基础实验：移动、钥匙、箱子与压板、人物传送、货物传送；随后可直接进入第 15—17 关的替罪芙高难试炼。完成关卡会自动保存进度。</p></div><aside class="progress"><b id="progressText">实验进度 0 / 8</b><br><span id="progressDesc">第 1 关已解锁</span><div class="bar"><i id="progressBar"></i></div></aside></header>
<section class="levels" aria-label="关卡选择">
<button class="level" data-level="1" data-title="第 1 关 · 初次逃离" data-desc="移动与墙体"><span class="num">1</span><span class="tag">基础教学</span><h2>初次逃离</h2><p>熟悉上下左右移动、墙体碰撞与抵达 Exit 的最基本目标。</p></button>
<button class="level" data-level="2" data-title="第 2 关 · 钥匙档案" data-desc="收集全部钥匙"><span class="num">2</span><span class="tag">待解锁</span><h2>钥匙档案</h2><p>Exit 只在收集到所有钥匙后才能完成通关验证。</p></button>
<button class="level" data-level="3" data-title="第 3 关 · 货物证词" data-desc="箱子与压力板"><span class="num">3</span><span class="tag">待解锁</span><h2>货物证词</h2><p>推动箱子压住压力板，取得两把钥匙后走向出口。</p></button>
<button class="level" data-level="4" data-title="第 4 关 · 折返门廊" data-desc="人物传送"><span class="num">4</span><span class="tag">待解锁</span><h2>折返门廊</h2><p>使用 M/m、N/n、C/c 三组双向传送门建立路线。</p></button>
<button class="level" data-level="5" data-title="第 5 关 · 货运回声" data-desc="箱子传送与出口占位"><span class="num">5</span><span class="tag">待解锁</span><h2>货运回声</h2><p>让箱子穿过传送门；出口被占时，下一次传送会失效。</p></button>
<button class="level" data-level="15" data-title="第 15 关 · 延迟六步的证词" data-desc="单替罪芙 · 6 步延迟 · 双箱 · 双传送"><span class="num">15</span><span class="tag">待解锁</span><h2>延迟六步的证词</h2><p>完成基础记录后，进入单替罪芙、双箱与双传送的高难试炼。</p></button>
<button class="level" data-level="16" data-title="第 16 关 · 转运回路" data-desc="箱阵与回路"><span class="num">16</span><span class="tag">待解锁</span><h2>转运回路</h2><p>装载台、上层环带、档案传送与铁箱转向室构成回流路线。</p></button>
<button class="level" data-level="17" data-title="第 17 关 · 双重证词" data-desc="双替罪芙 · 5 / 8 步延迟 · 四压板"><span class="num">17</span><span class="tag">待解锁</span><h2>双重证词</h2><p>两只不同延迟的替罪芙、四块专属压板、双箱和双传送必须同时成立。</p></button>
</section><section class="frame"><div class="framebar"><span>当前实验：<strong id="frameTitle"></strong></span><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="reset-progress" id="skipLevel">跳过当前关</button><button class="reset-progress" id="resetProgress">清除通关进度</button></div></div><iframe id="gameFrame" src="about:blank" title="黄金替罪芙关卡"></iframe></section>

</main>
<script>
(()=>{'use strict';
const ORDER=[1,2,3,4,5,15,16,17];
const LEVELS={
  1:{name:'第 1 关《初次逃离》',file:'levels/level-1.html'},2:{name:'第 2 关《钥匙档案》',file:'levels/level-2.html'},3:{name:'第 3 关《货物证词》',file:'levels/level-3.html'},4:{name:'第 4 关《折返门廊》',file:'levels/level-4.html'},5:{name:'第 5 关《货运回声》',file:'levels/level-5.html'},
  15:{name:'第 15 关《延迟六步的证词》',file:'levels/level-15.html'},16:{name:'第 16 关《转运回路》',file:'levels/level-16.html'},17:{name:'第 17 关《双重证词》',file:'levels/level-17.html'}
};
const KEY='golden-scapegoat-edition2-progress';
function read(){try{const raw=localStorage.getItem(KEY);if(!raw)return {unlockedIndex:0,completed:[]};const value=JSON.parse(raw);const done=Array.isArray(value.completed)?value.completed.map(Number).filter(x=>ORDER.includes(x)):[];if(Number.isInteger(value.unlockedIndex))return {unlockedIndex:Math.max(0,Math.min(ORDER.length-1,value.unlockedIndex)),completed:done};const legacy=Number(value.unlocked);/* Old 15—17-only saves keep every current card reachable, so this upgrade never hides a previously playable trial. */const idx=legacy>=15?ORDER.length-1:0;return {unlockedIndex:Math.max(0,idx),completed:done};}catch{return {unlockedIndex:0,completed:[]}}}
let state=read(),active=ORDER[Math.min(state.unlockedIndex,ORDER.length-1)],timer=null;
const frame=document.querySelector('#gameFrame'),frameTitle=document.querySelector('#frameTitle'),progressText=document.querySelector('#progressText'),progressDesc=document.querySelector('#progressDesc'),progressBar=document.querySelector('#progressBar'),toast=document.querySelector('#toast'),buttons=[...document.querySelectorAll('.level')];
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch{}}
function showToast(message){toast.textContent=message;toast.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>toast.classList.remove('show'),3600)}
function isDone(level){return state.completed.includes(level)}
function indexOf(level){return ORDER.indexOf(level)}
function isAvailable(level){return indexOf(level)<=state.unlockedIndex}
function paint(){buttons.forEach(button=>{const level=Number(button.dataset.level),locked=!isAvailable(level);button.disabled=locked;button.classList.toggle('active',level===active);button.querySelector('.tag').textContent=locked?'待解锁':isDone(level)?'已完成':level===active?'当前实验':level<15?'可游玩':'高难试炼';});const done=state.completed.length;progressText.textContent=`实验完成 ${done} / ${ORDER.length}`;const unlocked=ORDER[state.unlockedIndex];progressDesc.textContent=done===ORDER.length?'全部实验记录已完成':unlocked===15?'基础记录完成，第 15 关已解锁':`第 ${unlocked} 关已解锁`;progressBar.style.width=`${Math.max(8,done/ORDER.length*100)}%`;}
function open(level){if(!LEVELS[level]||!isAvailable(level))return;active=level;frame.src=LEVELS[level].file;frame.title=`黄金替罪芙 ${LEVELS[level].name}`;frameTitle.textContent=LEVELS[level].name;paint();window.scrollTo({top:document.querySelector('.frame').offsetTop-10,behavior:'smooth'});}
buttons.forEach(button=>button.addEventListener('click',()=>open(Number(button.dataset.level))));
function unlockAfter(level){const idx=indexOf(level);if(idx>=0&&idx<ORDER.length-1)state.unlockedIndex=Math.max(state.unlockedIndex,idx+1);}
window.addEventListener('message',event=>{if(event.origin!==location.origin||!event.data||event.source!==frame.contentWindow)return;const level=Number(event.data.level);if(!LEVELS[level])return;if(event.data.type==='golden-scapegoat-open-next'){const idx=indexOf(level);if(idx<ORDER.length-1){unlockAfter(level);save();paint();open(ORDER[idx+1]);}else document.querySelector('.levels').scrollIntoView({behavior:'smooth',block:'start'});return;}if(event.data.type!=='golden-scapegoat-complete')return;if(!isDone(level))state.completed.push(level);unlockAfter(level);save();paint();if(state.completed.length===ORDER.length)showToast('全部 8 段实验记录已完成。黄金替罪芙试玩章节通关！');else if(indexOf(level)<ORDER.length-1)showToast(`${LEVELS[level].name} 完成！${LEVELS[ORDER[indexOf(level)+1]].name} 已解锁。`);else showToast(`${LEVELS[level].name} 完成！章节进度已保存。`);});
document.querySelector('#skipLevel').addEventListener('click',()=>{const idx=indexOf(active);if(idx>=ORDER.length-1){showToast('已经是当前章节最后一关。');return;}const next=ORDER[idx+1];if(!confirm(`确定跳过第 ${active} 关并解锁第 ${next} 关吗？`))return;state.unlockedIndex=Math.max(state.unlockedIndex,idx+1);save();paint();open(next);showToast(`已跳过第 ${active} 关；第 ${next} 关已解锁。`);});
document.querySelector('#resetProgress').addEventListener('click',()=>{if(!confirm('确定清除第 1—5 与第 15—17 关的通关进度和解锁状态吗？'))return;state={unlockedIndex:0,completed:[]};save();open(1);paint();showToast('通关进度已清除。');});
paint();open(active);
})();
</script>
</body>
</html>
